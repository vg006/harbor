name: Publish Release Images with SBOMs

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing goharbor image tag to copy
        required: true
        default: v2.15.2
        type: string
      publish_tag:
        description: Destination image tag (defaults to sbom-test-<run number>)
        required: false
        type: string

jobs:
  release:
    runs-on: cncf-ubuntu-16-64-x86
    permissions:
      contents: read
      id-token: write   # Required for Cosign keyless signing
      packages: write   # Required for pushing images to ghcr.io
    env:
      HARBOR_IMAGES: >-
        harbor-portal harbor-core harbor-db harbor-jobservice
        harbor-registryctl valkey-photon nginx-photon registry-photon
        prepare harbor-log trivy-adapter-photon harbor-exporter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up image coordinates
        env:
          INPUT_SOURCE_TAG: ${{ inputs.source_tag }}
          INPUT_PUBLISH_TAG: ${{ inputs.publish_tag }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
        run: |
          set -euo pipefail

          source_tag="$INPUT_SOURCE_TAG"
          if [ -z "$source_tag" ]; then
            source_tag="${{ github.ref_name }}"
          fi

          publish_tag="$INPUT_PUBLISH_TAG"
          if [ -z "$publish_tag" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              publish_tag="${{ github.ref_name }}"
            else
              publish_tag="sbom-test-${{ github.run_number }}"
            fi
          fi

          if [ -z "$DOCKER_HUB_USERNAME" ]; then
            echo "DOCKER_HUB_USERNAME secret is required."
            exit 1
          fi

          {
            echo "SOURCE_TAG=$source_tag"
            echo "PUBLISH_TAG=$publish_tag"
            echo "DOCKER_HUB_NAMESPACE=${DOCKER_HUB_USERNAME,,}"
            echo "GHCR_NAMESPACE=${GITHUB_REPOSITORY_OWNER,,}"
          } >> "$GITHUB_ENV"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Setup Docker
        uses: docker-practice/actions-setup-docker@509de4a162d8fd24b2721a9fb3721131a6a4776b # master (no tagged release newer than v1/2023 covers this fix; commit dated 2025-08-24)
        with:
          docker_version: 20.10
          docker_channel: stable

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to registries
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$DOCKER_HUB_PASSWORD" ]; then
            echo "DOCKER_HUB_PASSWORD secret is required."
            exit 1
          fi
          printf '%s\n' "$DOCKER_HUB_PASSWORD" | docker login --username "$DOCKER_HUB_USERNAME" --password-stdin
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish and attest architecture images
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          source tools/release/release_utils.sh
          mkdir -p "$GITHUB_WORKSPACE/sboms"

          for arch in amd64 arm64; do
            for image in $HARBOR_IMAGES; do
              source_ref="goharbor/${image}:${SOURCE_TAG}"
              dockerhub_ref="${DOCKER_HUB_NAMESPACE}/${image}:${PUBLISH_TAG}-${arch}"
              ghcr_ref="ghcr.io/${GHCR_NAMESPACE}/${image}:${PUBLISH_TAG}-${arch}"
              sbom="$GITHUB_WORKSPACE/sboms/${image}-${arch}.spdx.json"

              retry 5 docker pull --platform "linux/${arch}" "$source_ref"
              docker tag "$source_ref" "$dockerhub_ref"
              docker tag "$source_ref" "$ghcr_ref"

              generateImageSBOM "$dockerhub_ref" "$sbom" "$SYFT"

              retry 5 docker push "$dockerhub_ref"
              retry 5 docker push "$ghcr_ref"
              attestImageSBOM "$dockerhub_ref" "$sbom"
              attestImageSBOM "$ghcr_ref" "$sbom"
            done
          done

      - name: Create multi-arch manifests
        run: |
          set -euo pipefail
          source tools/release/release_utils.sh

          for image in $HARBOR_IMAGES; do
            retry 5 docker buildx imagetools create \
              --tag "${DOCKER_HUB_NAMESPACE}/${image}:${PUBLISH_TAG}" \
              "${DOCKER_HUB_NAMESPACE}/${image}:${PUBLISH_TAG}-amd64" \
              "${DOCKER_HUB_NAMESPACE}/${image}:${PUBLISH_TAG}-arm64"
            retry 5 docker buildx imagetools create \
              --tag "ghcr.io/${GHCR_NAMESPACE}/${image}:${PUBLISH_TAG}" \
              "ghcr.io/${GHCR_NAMESPACE}/${image}:${PUBLISH_TAG}-amd64" \
              "ghcr.io/${GHCR_NAMESPACE}/${image}:${PUBLISH_TAG}-arm64"
          done

      - name: Upload image SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-sboms-${{ env.PUBLISH_TAG }}
          path: sboms/*.spdx.json
          if-no-files-found: error

      - name: Log out of registries
        if: ${{ always() }}
        run: |
          docker logout ghcr.io
          docker logout
